<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shift Clock">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f172a">
<meta name="robots" content="noindex">
<title>Shift Clock</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#0f172a;--mute:#64748b;--line:#e2e8f0;--in:#16a34a;--out:#dc2626;--accent:#2563eb;--warn:#b45309;--warnbg:#fef3c7}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#131c2e;--ink:#e6ebf5;--mute:#93a1b8;--line:#223049;--in:#22c55e;--out:#f87171;--accent:#60a5fa;--warn:#fcd34d;--warnbg:#3a2f0b}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
main{max-width:480px;margin:0 auto}
h1{font-size:15px;font-weight:600;color:var(--mute);margin:0 0 12px;letter-spacing:.04em;text-transform:uppercase}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.status{text-align:center}
.status .big{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;margin:4px 0}
.status .sub{color:var(--mute);min-height:22px}
button{font:inherit;cursor:pointer}
.clock{display:block;width:100%;margin-top:14px;border:0;border-radius:14px;padding:20px;font-size:22px;font-weight:700;color:#fff;background:var(--in)}
.clock.out{background:var(--out)}
.clock:active{transform:scale(.98)}
.banner{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:12px;margin-bottom:14px;font-size:14px}
.banner button{margin-top:8px;border:0;background:var(--warn);color:var(--card);border-radius:8px;padding:8px 12px;font-weight:600}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.nav button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 14px;font-size:18px}
.nav strong{font-size:18px}
.totals{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.totals div{background:var(--bg);border-radius:12px;padding:10px}
.totals b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.totals span{font-size:12px;color:var(--mute)}
.shift{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border:0;border-top:1px solid var(--line);width:100%;background:none;color:var(--ink);text-align:left}
.shift:first-child{border-top:0}
.shift small{color:var(--mute);display:block}
.shift .h{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.open{color:var(--in);font-weight:600}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:12px;font-weight:600}
.primary{background:var(--accent)!important;color:#fff!important;border:0!important}
.danger{color:var(--out)!important}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input[type=datetime-local]{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
dialog{border:0;border-radius:16px;padding:18px;width:min(92vw,420px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:#0008}
.dlg .actions{margin-top:12px}
.note{font-size:12px;color:var(--mute);text-align:center;margin:8px 0 0}
textarea{width:100%;height:170px;font:13px/1.4 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--ink);margin-top:8px}
</style>
</head>
<body>
<main>
  <h1>Shift Clock</h1>
  <div id="banner"></div>
  <section class="card status">
    <div class="sub" id="sub"></div>
    <div class="big" id="big">--:--</div>
    <div class="sub" id="today"></div>
    <button class="clock" id="clock"></button>
  </section>

  <section class="card">
    <div class="nav"><button id="prev" aria-label="Previous month">‹</button><strong id="month"></strong><button id="next" aria-label="Next month">›</button></div>
    <div class="totals">
      <div><b id="tAll">0.00</b><span>hours worked</span></div>
      <div><b id="tRule">0.00</b><span>hours if the 17:30 rule applies</span></div>
    </div>
    <div id="list"></div>
    <p class="note">The unpaid half hour after 17:30 counts only in the right-hand total.</p>
  </section>

  <section class="card">
    <div class="actions">
      <button id="add">Add a shift</button>
      <button id="export" class="primary">Copy month</button>
      <button id="backup">Backup</button>
      <button id="restore">Restore</button>
    </div>
    <p class="note">Everything is saved only on this phone. Make a backup now and then.</p>
  </section>
</main>

<dialog id="edit"><div class="dlg">
  <strong id="editTitle">Shift</strong>
  <label for="eStart">Clocked in</label><input type="datetime-local" id="eStart">
  <label for="eEnd">Clocked out (leave empty if still working)</label><input type="datetime-local" id="eEnd">
  <div class="actions"><button id="eDel" class="danger">Delete</button><button id="eSave" class="primary">Save</button></div>
  <div class="actions"><button id="eCancel" style="grid-column:1/3">Cancel</button></div>
</div></dialog>

<dialog id="text"><div class="dlg">
  <strong id="textTitle"></strong>
  <textarea id="textArea" spellcheck="false"></textarea>
  <div class="actions"><button id="textCopy" class="primary">Copy</button><button id="textClose">Close</button></div>
  <div class="actions" id="restoreRow" hidden><button id="textRestore" class="primary" style="grid-column:1/3">Restore from this text</button></div>
</div></dialog>

<script>
const KEY = "shiftclock.v1";
const $ = (id) => document.getElementById(id);
let shifts = [];
try { shifts = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) { shifts = []; }
let view = new Date(); view.setDate(1); view.setHours(0, 0, 0, 0);
let editing = null;

const save = () => { try { localStorage.setItem(KEY, JSON.stringify(shifts)); } catch (e) {} };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const pad = (n) => String(n).padStart(2, "0");
const hm = (d) => pad(d.getHours()) + ":" + pad(d.getMinutes());
const dayLabel = (d) => d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
const local = (iso) => { const d = new Date(iso); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + "T" + hm(d); };
const hours = (s, e) => Math.max(0, (new Date(e) - new Date(s)) / 36e5);
// The company's unpaid half hour after 17:30, taken off on the day the shift ends.
function ruleHours(s, e) {
  const end = new Date(e), cut = new Date(end); cut.setHours(17, 30, 0, 0);
  const lost = Math.min(0.5, Math.max(0, (end - cut) / 36e5));
  return Math.max(0, hours(s, e) - lost);
}
const fmt = (h) => h.toFixed(2);
const openShift = () => shifts.find((s) => !s.end);

function render() {
  const o = openShift();
  const btn = $("clock");
  btn.textContent = o ? "Clock out" : "Clock in";
  btn.className = "clock" + (o ? " out" : "");
  $("sub").textContent = o ? "Working since " + hm(new Date(o.start)) : "Not clocked in";
  tick();

  const ms = view.getMonth(), ys = view.getFullYear();
  $("month").textContent = view.toLocaleDateString("en-GB", { month: "long", year: "numeric" });
  const mine = shifts.filter((s) => { const d = new Date(s.start); return d.getMonth() === ms && d.getFullYear() === ys; })
    .sort((a, b) => new Date(b.start) - new Date(a.start));
  let all = 0, rule = 0;
  $("list").innerHTML = "";
  if (!mine.length) $("list").innerHTML = '<p class="note">No shifts this month yet.</p>';
  for (const s of mine) {
    const b = document.createElement("button"); b.className = "shift";
    const d = new Date(s.start);
    if (s.end) {
      const h = hours(s.start, s.end), r = ruleHours(s.start, s.end); all += h; rule += r;
      b.innerHTML = `<div>${dayLabel(d)}<small>${hm(d)} to ${hm(new Date(s.end))}</small></div><div class="h">${fmt(h)}<small>${fmt(r)} with rule</small></div>`;
    } else {
      b.innerHTML = `<div>${dayLabel(d)}<small>${hm(d)} to ...</small></div><div class="h open">working</div>`;
    }
    b.onclick = () => openEdit(s);
    $("list").appendChild(b);
  }
  $("tAll").textContent = fmt(all); $("tRule").textContent = fmt(rule);

  const stale = o && new Date(o.start).toDateString() !== new Date().toDateString();
  $("banner").innerHTML = stale
    ? `<div class="banner">You didn't clock out on ${dayLabel(new Date(o.start))}. Set your finish time.<br><button id="fix">Fix it</button></div>` : "";
  if (stale) $("fix").onclick = () => openEdit(o);
}

function tick() {
  const o = openShift();
  if (o) {
    const m = Math.floor((Date.now() - new Date(o.start)) / 6e4);
    $("big").textContent = Math.floor(m / 60) + "h " + pad(m % 60) + "m";
  } else $("big").textContent = hm(new Date());
  const t = new Date().toDateString();
  const today = shifts.filter((s) => s.end && new Date(s.start).toDateString() === t).reduce((a, s) => a + hours(s.start, s.end), 0);
  $("today").textContent = today ? "Today so far: " + fmt(today) + " h" : "";
}
setInterval(tick, 20000);

$("clock").onclick = () => {
  const o = openShift();
  if (o) o.end = new Date().toISOString(); else shifts.push({ id: uid(), start: new Date().toISOString(), end: null });
  save(); render();
  if (navigator.vibrate) navigator.vibrate(30);
};
$("prev").onclick = () => { view.setMonth(view.getMonth() - 1); render(); };
$("next").onclick = () => { view.setMonth(view.getMonth() + 1); render(); };

function openEdit(s) {
  editing = s || { id: uid(), start: new Date().toISOString(), end: null, isNew: true };
  $("editTitle").textContent = editing.isNew ? "Add a shift" : "Edit shift";
  $("eStart").value = local(editing.start);
  $("eEnd").value = editing.end ? local(editing.end) : "";
  $("eDel").style.display = editing.isNew ? "none" : "";
  $("edit").showModal();
}
$("add").onclick = () => openEdit(null);
$("eCancel").onclick = () => $("edit").close();
$("eSave").onclick = () => {
  const st = $("eStart").value, en = $("eEnd").value;
  if (!st) return;
  if (en && new Date(en) <= new Date(st)) { alert("The finish time must be after the start."); return; }
  const rec = { id: editing.id, start: new Date(st).toISOString(), end: en ? new Date(en).toISOString() : null };
  const i = shifts.findIndex((x) => x.id === rec.id);
  if (i >= 0) shifts[i] = rec; else shifts.push(rec);
  save(); $("edit").close(); render();
};
$("eDel").onclick = () => { if (confirm("Delete this shift?")) { shifts = shifts.filter((x) => x.id !== editing.id); save(); $("edit").close(); render(); } };

function showText(title, text, canRestore) {
  $("textTitle").textContent = title; $("textArea").value = text; $("textArea").readOnly = !canRestore;
  $("restoreRow").hidden = !canRestore; $("text").showModal();
}
$("textClose").onclick = () => $("text").close();
$("textCopy").onclick = async () => {
  try { await navigator.clipboard.writeText($("textArea").value); $("textCopy").textContent = "Copied"; setTimeout(() => $("textCopy").textContent = "Copy", 1500); }
  catch (e) { $("textArea").select(); }
};
$("export").onclick = () => {
  const ms = view.getMonth(), ys = view.getFullYear();
  const mine = shifts.filter((s) => s.end && new Date(s.start).getMonth() === ms && new Date(s.start).getFullYear() === ys)
    .sort((a, b) => new Date(a.start) - new Date(b.start));
  let all = 0, rule = 0;
  const lines = mine.map((s) => {
    const h = hours(s.start, s.end), r = ruleHours(s.start, s.end); all += h; rule += r;
    return new Date(s.start).getDate() + " " + view.toLocaleDateString("en-GB", { month: "short" }) + "  " + hm(new Date(s.start)) + "-" + hm(new Date(s.end)) + "  " + fmt(h) + " h";
  });
  lines.push("", "Total worked: " + fmt(all) + " h", "Total if the 17:30 rule applies: " + fmt(rule) + " h");
  showText($("month").textContent, lines.join("\n"), false);
};
$("backup").onclick = () => showText("Backup (copy and keep this)", JSON.stringify(shifts), false);
$("restore").onclick = () => showText("Paste a backup here", "", true);
$("textRestore").onclick = () => {
  try {
    const data = JSON.parse($("textArea").value);
    if (!Array.isArray(data) || !data.every((x) => x.id && x.start)) throw 0;
    if (!confirm("Replace everything on this phone with this backup?")) return;
    shifts = data; save(); $("text").close(); render();
  } catch (e) { alert("That doesn't look like a backup."); }
};

if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
render();
</script>
</body>
</html>
